name: tool_registry
display_name: "Tool Registry"
description: "Tool registry, schemas, permissions, and audit-safe invocation policy for AI products"
version: 0.1.11
access: free
status: stable
tier: free
category: ai
tags:
  - ai
  - tools
  - permissions
  - schemas
  - audit
depends_on:
  - free/security/audit_policy
  - free/observability/core
generated_from_config: true
profile_inherits:
  fastapi.standard: fastapi
  fastapi.ddd: fastapi
  nestjs.standard: nestjs
config_sources:
  - config/base.yaml
  - config/snippets.yaml
generation:
  vendor:
    root: .rapidkit/vendor
    files:
      - template: templates/base/tool_registry.py.j2
        relative: src/modules/free/ai/tool_registry/tool_registry.py
      - template: templates/base/tool_registry_types.py.j2
        relative: src/modules/free/ai/tool_registry/tool_registry_types.py
      - template: templates/base/tool_registry_health.py.j2
        relative: src/health/ai/tool_registry.py
      - template: templates/vendor/nestjs/configuration.js.j2
        relative: nestjs/configuration.js
  variants:
    fastapi: &fastapi_variant
      root: .
      context:
        framework: fastapi
        module_class_name: ToolRegistry
      files:
        - template: templates/variants/fastapi/tool_registry.py.j2
          output: src/modules/free/ai/tool_registry/tool_registry.py
        - template: templates/variants/fastapi/tool_registry_routes.py.j2
          output: src/modules/free/ai/tool_registry/routers/ai/tool_registry.py
        - template: templates/variants/fastapi/tool_registry_health.py.j2
          output: src/health/ai/tool_registry.py
        - template: templates/tests/integration/test_tool_registry_integration.j2
          output: tests/modules/free/integration/ai/tool_registry/test_tool_registry_integration.py
        - template: templates/variants/fastapi/tests/test_tool_registry_e2e.py
          output: tests/modules/e2e/free/ai/tool_registry/test_tool_registry_e2e.py

    # Compatibility aliases: the installer uses kit profile names.
    fastapi.standard: *fastapi_variant
    fastapi.ddd: *fastapi_variant

    nestjs: &nestjs_variant
      root: .
      context:
        framework: nestjs
        vendor_configuration_relative: nestjs/configuration.js
        module_class_name: ToolRegistry
        module_kebab: tool-registry
      files:
        - template: templates/variants/nestjs/tool_registry.service.ts.j2
          output: src/modules/free/ai/tool_registry/tool_registry.service.ts
        - template: templates/variants/nestjs/tool_registry.controller.ts.j2
          output: src/modules/free/ai/tool_registry/tool_registry.controller.ts
        - template: templates/variants/nestjs/tool_registry.module.ts.j2
          output: src/modules/free/ai/tool_registry/tool_registry.module.ts
        - template: templates/variants/nestjs/tool_registry.health.ts.j2
          output: src/health/tool_registry.health.ts
        - template: templates/variants/nestjs/tool_registry.validation.ts.j2
          output: src/modules/free/ai/tool_registry/tool_registry.validation.ts
        - template: templates/variants/nestjs/tool_registry.index.ts.j2
          output: src/modules/free/ai/tool_registry/index.ts
        - template: templates/variants/nestjs/tool_registry.configuration.ts.j2
          output: src/modules/free/ai/tool_registry/configuration.ts
        - template: templates/variants/nestjs/tests/tool_registry.e2e-spec.ts
          output: tests/modules/e2e/ai/tool_registry/tool_registry.e2e-spec.ts

    nestjs.standard: *nestjs_variant
  snippets:
    enabled: true
    config: config/snippets.yaml
    default: []
compatibility:
  python: ">=3.9,<4.0"
  frameworks:
    - fastapi
    - nestjs
  os:
    - linux
    - darwin
    - windows
testing:
  coverage_min: 85
  integration_tests: true
  e2e_tests: false
  unit_tests:
    - tests/modules/free/ai/tool_registry/test_tool_registry_generator.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_overrides.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_runtime.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_adapters.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_validation.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_error_handling.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_health_check.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_framework_variants.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_vendor_layer.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_configuration.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_versioning.py
    - tests/modules/free/ai/tool_registry/test_tool_registry_standard_module.py
  integration_test_files:
    - tests/modules/free/integration/ai/tool_registry/test_tool_registry_integration.py
  fixtures: []
documentation:
  changelog: "docs/changelog.md"
  readme: "README.md"
  overview: "docs/overview.md"
  usage: "docs/usage.md"
  advanced: "docs/advanced.md"
  migration: "docs/migration.md"
  troubleshooting: "docs/troubleshooting.md"
  api_docs: "docs/api-reference.md"
  examples: []
support:
  issues: https://github.com/chistiq/rapidkit-core/issues
  discussions: https://github.com/chistiq/rapidkit-core/discussions
  documentation: https://getrapidkit.com/modules/tool_registry
changelog:
  - version: "0.1.11"
    date: "2026-09-02"
    notes: "See docs/changelog.md"
validation:
  pre_install:
    - check_python_version
  post_install:
    - validate_generated_code
rollback:
  strategy: uninstall
  backup_path: .rapidkit/backups/
  max_backups: 3
performance:
  lazy_loading: true
  caching:
    templates: true
    ttl: 300
capabilities:
  - tool_schema_registry
  - tool_permission_policy
  - high_risk_tool_gates
  - invocation_audit
  - health_checks
metadata:
  enterprise_ready: true
  free_marketplace_module: true
  product_factory_priority: high
signature: null
signer_id: null
signature_version: null

