  usage: "docs/usage.md"
  advanced: "docs/advanced.md"
  migration: "docs/migration.md"
  troubleshooting: "docs/troubleshooting.md"
  api_docs: "docs/api-reference.md"
  examples: []
support:
  issues: https://github.com/chistiq/rapidkit-core/issues
  discussions: https://github.com/chistiq/rapidkit-core/discussions
  documentation: https://getrapidkit.com/modules/ai_guardrails
changelog:
  - version: "0.1.11"
    date: "2026-09-02"
    notes: "See docs/changelog.md"
validation:
  pre_install:
    - check_python_version
  post_install:
    - validate_generated_code
rollback:
