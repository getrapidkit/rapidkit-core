name: ai_guardrails
display_name: "Ai Guardrails"
description: "AI input/output safety policy, PII redaction hooks, and model boundary checks"
version: 0.1.11
access: free
status: stable
tier: free
category: ai
tags:
  - ai
  - guardrails
  - pii
  - safety
  - policy
depends_on:
  - free/ai/llm_gateway
  - free/ai/tool_registry
  - free/security/audit_policy
  - free/observability/core
generated_from_config: true
profile_inherits:
  fastapi.standard: fastapi
  fastapi.ddd: fastapi
  nestjs.standard: nestjs
config_sources:
  - config/base.yaml
  - config/snippets.yaml
generation:
  vendor:
    root: .rapidkit/vendor
    files:
      - template: templates/base/ai_guardrails.py.j2
        relative: src/modules/free/ai/ai_guardrails/ai_guardrails.py
      - template: templates/base/ai_guardrails_types.py.j2
        relative: src/modules/free/ai/ai_guardrails/ai_guardrails_types.py
      - template: templates/base/ai_guardrails_health.py.j2
        relative: src/health/ai/ai_guardrails.py
      - template: templates/vendor/nestjs/configuration.js.j2
        relative: nestjs/configuration.js
  variants:
    fastapi: &fastapi_variant
      root: .
      context:
        framework: fastapi
        module_class_name: AiGuardrails
      files:
        - template: templates/variants/fastapi/ai_guardrails.py.j2
          output: src/modules/free/ai/ai_guardrails/ai_guardrails.py
        - template: templates/variants/fastapi/ai_guardrails_routes.py.j2
          output: src/modules/free/ai/ai_guardrails/routers/ai/ai_guardrails.py
        - template: templates/variants/fastapi/ai_guardrails_health.py.j2
          output: src/health/ai/ai_guardrails.py
        - template: templates/tests/integration/test_ai_guardrails_integration.j2
          output: tests/modules/free/integration/ai/ai_guardrails/test_ai_guardrails_integration.py
        - template: templates/variants/fastapi/tests/test_ai_guardrails_e2e.py
          output: tests/modules/e2e/free/ai/ai_guardrails/test_ai_guardrails_e2e.py

    # Compatibility aliases: the installer uses kit profile names.
    fastapi.standard: *fastapi_variant
    fastapi.ddd: *fastapi_variant

    nestjs: &nestjs_variant
      root: .
      context:
        framework: nestjs
        vendor_configuration_relative: nestjs/configuration.js
        module_class_name: AiGuardrails
        module_kebab: ai-guardrails
      files:
        - template: templates/variants/nestjs/ai_guardrails.service.ts.j2
          output: src/modules/free/ai/ai_guardrails/ai_guardrails.service.ts
        - template: templates/variants/nestjs/ai_guardrails.controller.ts.j2
          output: src/modules/free/ai/ai_guardrails/ai_guardrails.controller.ts
        - template: templates/variants/nestjs/ai_guardrails.module.ts.j2
          output: src/modules/free/ai/ai_guardrails/ai_guardrails.module.ts
        - template: templates/variants/nestjs/ai_guardrails.health.ts.j2
          output: src/health/ai_guardrails.health.ts
        - template: templates/variants/nestjs/ai_guardrails.validation.ts.j2
          output: src/modules/free/ai/ai_guardrails/ai_guardrails.validation.ts
        - template: templates/variants/nestjs/ai_guardrails.index.ts.j2
          output: src/modules/free/ai/ai_guardrails/index.ts
        - template: templates/variants/nestjs/ai_guardrails.configuration.ts.j2
          output: src/modules/free/ai/ai_guardrails/configuration.ts
        - template: templates/variants/nestjs/tests/ai_guardrails.e2e-spec.ts
          output: tests/modules/e2e/ai/ai_guardrails/ai_guardrails.e2e-spec.ts

    nestjs.standard: *nestjs_variant
  snippets:
    enabled: true
    config: config/snippets.yaml
    default: []
compatibility:
  python: ">=3.9,<4.0"
  frameworks:
    - fastapi
    - nestjs
  os:
    - linux
    - darwin
    - windows
testing:
  coverage_min: 85
  integration_tests: true
  e2e_tests: false
  unit_tests:
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_generator.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_overrides.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_runtime.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_adapters.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_validation.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_error_handling.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_health_check.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_framework_variants.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_vendor_layer.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_configuration.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_versioning.py
    - tests/modules/free/ai/ai_guardrails/test_ai_guardrails_standard_module.py
  integration_test_files:
    - tests/modules/free/integration/ai/ai_guardrails/test_ai_guardrails_integration.py
  fixtures: []
