  backup_path: .rapidkit/backups/
  max_backups: 3
performance:
  lazy_loading: true
  caching:
    templates: true
    ttl: 300
capabilities:
  - pii_detection
  - pii_redaction
  - blocked_term_policy
  - secret_detection
  - input_output_safety_checks
  - health_checks
metadata:
  enterprise_ready: true
  free_marketplace_module: true
  product_factory_priority: high
