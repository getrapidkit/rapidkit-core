      - template: templates/base/prompt_ops_health.py.j2
        relative: src/health/ai/prompt_ops.py
      - template: templates/vendor/nestjs/configuration.js.j2
        relative: nestjs/configuration.js
  variants:
    fastapi: &fastapi_variant
      root: .
      context:
        framework: fastapi
        module_class_name: PromptOps
      files:
        - template: templates/variants/fastapi/prompt_ops.py.j2
          output: src/modules/free/ai/prompt_ops/prompt_ops.py
        - template: templates/variants/fastapi/prompt_ops_routes.py.j2
          output: src/modules/free/ai/prompt_ops/routers/ai/prompt_ops.py
        - template: templates/variants/fastapi/prompt_ops_health.py.j2
          output: src/health/ai/prompt_ops.py
        - template: templates/tests/integration/test_prompt_ops_integration.j2
          output: tests/modules/free/integration/ai/prompt_ops/test_prompt_ops_integration.py
        - template: templates/variants/fastapi/tests/test_prompt_ops_e2e.py
          output: tests/modules/e2e/free/ai/prompt_ops/test_prompt_ops_e2e.py

    # Compatibility aliases: the installer uses kit profile names.
    fastapi.standard: *fastapi_variant
    fastapi.ddd: *fastapi_variant

    nestjs: &nestjs_variant
      root: .
      context:
        framework: nestjs
        vendor_configuration_relative: nestjs/configuration.js
        module_class_name: PromptOps
        module_kebab: prompt-ops
      files:
        - template: templates/variants/nestjs/prompt_ops.service.ts.j2
          output: src/modules/free/ai/prompt_ops/prompt_ops.service.ts
        - template: templates/variants/nestjs/prompt_ops.controller.ts.j2
          output: src/modules/free/ai/prompt_ops/prompt_ops.controller.ts
        - template: templates/variants/nestjs/prompt_ops.module.ts.j2
          output: src/modules/free/ai/prompt_ops/prompt_ops.module.ts
        - template: templates/variants/nestjs/prompt_ops.health.ts.j2
          output: src/health/prompt_ops.health.ts
        - template: templates/variants/nestjs/prompt_ops.validation.ts.j2
          output: src/modules/free/ai/prompt_ops/prompt_ops.validation.ts
        - template: templates/variants/nestjs/prompt_ops.index.ts.j2
          output: src/modules/free/ai/prompt_ops/index.ts
        - template: templates/variants/nestjs/prompt_ops.configuration.ts.j2
          output: src/modules/free/ai/prompt_ops/configuration.ts
        - template: templates/variants/nestjs/tests/prompt_ops.e2e-spec.ts
          output: tests/modules/e2e/ai/prompt_ops/prompt_ops.e2e-spec.ts

    nestjs.standard: *nestjs_variant
  snippets:
    enabled: true
    config: config/snippets.yaml
    default: []
compatibility:
  python: ">=3.9,<4.0"
  frameworks:
    - fastapi
    - nestjs
  os:
