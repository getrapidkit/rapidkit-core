    - tests/modules/free/ai/prompt_ops/test_prompt_ops_overrides.py
    - tests/modules/free/ai/prompt_ops/test_prompt_ops_runtime.py
    - tests/modules/free/ai/prompt_ops/test_prompt_ops_adapters.py
