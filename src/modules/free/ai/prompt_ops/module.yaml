    - tests/modules/free/ai/prompt_ops/test_prompt_ops_framework_variants.py
    - tests/modules/free/ai/prompt_ops/test_prompt_ops_vendor_layer.py
    - tests/modules/free/ai/prompt_ops/test_prompt_ops_configuration.py
    - tests/modules/free/ai/prompt_ops/test_prompt_ops_versioning.py
    - tests/modules/free/ai/prompt_ops/test_prompt_ops_standard_module.py
  integration_test_files:
