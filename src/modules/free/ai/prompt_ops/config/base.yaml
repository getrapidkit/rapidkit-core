# Module configuration baseline for Prompt Ops
name: prompt_ops
display_name: "Prompt Ops"
description: "Prompt versioning, rollout, evaluation, rollback, and audit operations for AI products"
root_path: src/

profiles:
  fastapi/standard:
    description: "FastAPI runtime profile for Prompt Ops REST, health, and overrides integration."
  nestjs/standard:
    description: "NestJS module wiring providers and controllers for Prompt Ops."
  vendor/baseline:
    description: "Vendor layer templates emitted for Prompt Ops runtime contracts."
variables:
  log_level:
    type: string
    default: INFO
    description: "Logging threshold used by Prompt Ops components."
    validation: "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)$"
  request_timeout_seconds:
    type: integer
    default: 30
    description: "Default timeout (seconds) for outbound calls initiated by Prompt Ops."
    validation: "^[0-9]+$"
  feature_flag_enabled:
    type: boolean
    default: false
    description: "Toggle demonstrating feature gating inside Prompt Ops workflows."
depends_on:
  fastapi/standard: []
  nestjs/standard: []
dev_dependencies:
  -
    name: pytest
    source: external
    tool: pip
    version: ">=9.0.3,<10.0"
  -
    name: pytest-asyncio
    source: external
    tool: pip
    version: ">=1.3.0,<2.0"
  -
    name: ruff
    source: external
    tool: pip
    version: ">=0.14.0,<1.0"
