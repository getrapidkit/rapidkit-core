name: middleware
tier: free
status: active

profiles:
  fastapi/standard:
    description: Standard FastAPI project support for this module.
  fastapi/ddd:
    inherits: fastapi/standard
    description: FastAPI DDD project support with the same runtime contract.
  nestjs/standard:
    description: NestJS project support for this module.

defaults:
  enabled: true
  cors_enabled: false
  cors_allow_origins:
    - "*"
  cors_allow_methods:
    - "*"
  cors_allow_headers:
    - "*"
  cors_allow_credentials: true
  process_time_header: true
  service_header: true
  service_header_name: X-Service
  service_name: ""
  custom_headers: true
  custom_header_name: X-Custom-Header
  custom_header_value: RapidKit
