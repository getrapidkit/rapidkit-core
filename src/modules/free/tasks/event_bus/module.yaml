        - template: templates/variants/nestjs/event_bus.index.ts.j2
          output: src/modules/free/tasks/event_bus/index.ts
        - template: templates/variants/nestjs/event_bus.configuration.ts.j2
          output: src/modules/free/tasks/event_bus/configuration.ts
        - template: templates/variants/nestjs/tests/event_bus.e2e-spec.ts
          output: tests/modules/e2e/tasks/event_bus/event_bus.e2e-spec.ts

    nestjs.standard: *nestjs_variant
  snippets:
