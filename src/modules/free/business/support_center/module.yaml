name: support_center
display_name: "Support Center"
description: "Support center foundation with tickets, SLA state, customer notes, assignments, and audit-ready support workflows"
version: 0.1.8
access: free
status: stable
tier: free
category: business
tags:
  - business
  - support
  - tickets
  - sla
  - audit
depends_on:
  - free/security/audit_policy
  - free/observability/core
  - free/communication/notifications
  - free/communication/email
generated_from_config: true
profile_inherits:
  fastapi.standard: fastapi
  fastapi.ddd: fastapi
  nestjs.standard: nestjs
config_sources:
  - config/base.yaml
  - config/snippets.yaml
generation:
  vendor:
    root: .rapidkit/vendor
    files:
      - template: templates/base/support_center.py.j2
        relative: src/modules/free/business/support_center/support_center.py
      - template: templates/base/support_center_types.py.j2
        relative: src/modules/free/business/support_center/support_center_types.py
      - template: templates/base/support_center_health.py.j2
        relative: src/health/business/support_center.py
      - template: templates/vendor/nestjs/configuration.js.j2
        relative: nestjs/configuration.js
  variants:
    fastapi: &fastapi_variant
      root: .
      context:
        framework: fastapi
        module_class_name: SupportCenter
      files:
        - template: templates/variants/fastapi/support_center.py.j2
          output: src/modules/free/business/support_center/support_center.py
        - template: templates/variants/fastapi/support_center_routes.py.j2
          output: src/modules/free/business/support_center/routers/business/support_center.py
        - template: templates/variants/fastapi/support_center_health.py.j2
          output: src/health/business/support_center.py
        - template: templates/tests/integration/test_support_center_integration.j2
          output: tests/modules/free/integration/business/support_center/test_support_center_integration.py
        - template: templates/variants/fastapi/tests/test_support_center_e2e.py
          output: tests/modules/e2e/free/business/support_center/test_support_center_e2e.py

    # Compatibility aliases: the installer uses kit profile names.
    fastapi.standard: *fastapi_variant
    fastapi.ddd: *fastapi_variant

    nestjs: &nestjs_variant
      root: .
      context:
        framework: nestjs
        vendor_configuration_relative: nestjs/configuration.js
        module_class_name: SupportCenter
        module_kebab: support-center
      files:
        - template: templates/variants/nestjs/support_center.service.ts.j2
          output: src/modules/free/business/support_center/support_center.service.ts
        - template: templates/variants/nestjs/support_center.controller.ts.j2
          output: src/modules/free/business/support_center/support_center.controller.ts
        - template: templates/variants/nestjs/support_center.module.ts.j2
          output: src/modules/free/business/support_center/support_center.module.ts
        - template: templates/variants/nestjs/support_center.health.ts.j2
          output: src/health/support_center.health.ts
        - template: templates/variants/nestjs/support_center.validation.ts.j2
          output: src/modules/free/business/support_center/support_center.validation.ts
        - template: templates/variants/nestjs/support_center.index.ts.j2
          output: src/modules/free/business/support_center/index.ts
        - template: templates/variants/nestjs/support_center.configuration.ts.j2
          output: src/modules/free/business/support_center/configuration.ts
        - template: templates/variants/nestjs/tests/support_center.e2e-spec.ts
          output: tests/modules/e2e/business/support_center/support_center.e2e-spec.ts

    nestjs.standard: *nestjs_variant
  snippets:
    enabled: true
    config: config/snippets.yaml
    default: []
compatibility:
  python: ">=3.9,<4.0"
  frameworks:
    - fastapi
    - nestjs
  os:
    - linux
    - darwin
    - windows
testing:
  coverage_min: 85
  integration_tests: true
  e2e_tests: false
  unit_tests:
    - tests/modules/free/business/support_center/test_support_center_generator.py
    - tests/modules/free/business/support_center/test_support_center_overrides.py
    - tests/modules/free/business/support_center/test_support_center_runtime.py
    - tests/modules/free/business/support_center/test_support_center_adapters.py
    - tests/modules/free/business/support_center/test_support_center_validation.py
    - tests/modules/free/business/support_center/test_support_center_error_handling.py
    - tests/modules/free/business/support_center/test_support_center_health_check.py
    - tests/modules/free/business/support_center/test_support_center_framework_variants.py
    - tests/modules/free/business/support_center/test_support_center_vendor_layer.py
    - tests/modules/free/business/support_center/test_support_center_configuration.py
    - tests/modules/free/business/support_center/test_support_center_versioning.py
    - tests/modules/free/business/support_center/test_support_center_standard_module.py
  integration_test_files:
    - tests/modules/free/integration/business/support_center/test_support_center_integration.py
  fixtures: []
documentation:
  changelog: "docs/changelog.md"
  readme: "README.md"
  overview: "docs/overview.md"
  usage: "docs/usage.md"
  advanced: "docs/advanced.md"
  migration: "docs/migration.md"
  troubleshooting: "docs/troubleshooting.md"
  api_docs: "docs/api-reference.md"
  examples: []
support:
  issues: https://github.com/rapidkitlabs/rapidkit-core/issues
  discussions: https://github.com/rapidkitlabs/rapidkit-core/discussions
  documentation: https://getrapidkit.com/modules/support_center
changelog:
  - version: "0.1.8"
    date: "2026-07-07"
    notes: "See docs/changelog.md"
validation:
  pre_install:
    - check_python_version
  post_install:
    - validate_generated_code
rollback:
  strategy: uninstall
  backup_path: .rapidkit/backups/
  max_backups: 3
performance:
  lazy_loading: true
  caching:
    templates: true
    ttl: 300
capabilities:
  - ticket_lifecycle
  - assignments
  - support_notes
  - sla_breach_detection
  - customer_operations
  - audit_trail
  - health_checks
metadata:
  enterprise_ready: true
  free_marketplace_module: true
  product_factory_priority: high
