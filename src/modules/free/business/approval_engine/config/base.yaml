# Module configuration baseline for Approval Engine
name: approval_engine
display_name: "Approval Engine"
description: "Approval workflow engine with policies, required reasons, reviewer decisions, escalation, and immutable audit trails"
root_path: src/

profiles:
  fastapi/standard:
    description: "FastAPI runtime profile for Approval Engine REST, health, and overrides integration."
  nestjs/standard:
    description: "NestJS module wiring providers and controllers for Approval Engine."
  vendor/baseline:
    description: "Vendor layer templates emitted for Approval Engine runtime contracts."
variables:
  log_level:
    type: string
    default: INFO
    description: "Logging threshold used by Approval Engine components."
    validation: "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)$"
  request_timeout_seconds:
    type: integer
    default: 30
    description: "Default timeout (seconds) for outbound calls initiated by Approval Engine."
    validation: "^[0-9]+$"
  feature_flag_enabled:
    type: boolean
    default: false
    description: "Toggle demonstrating feature gating inside Approval Engine workflows."
depends_on:
  fastapi/standard:
    - free/security/audit_policy
    - free/observability/core
    - free/tasks/workflow_engine
  nestjs/standard:
    - free/security/audit_policy
    - free/observability/core
    - free/tasks/workflow_engine
dev_dependencies:
  -
    name: pytest
    source: external
    tool: pip
    version: ">=8.0.0,<9.0"
  -
    name: pytest-asyncio
    source: external
    tool: pip
    version: ">=0.23.0,<1.0"
  -
    name: ruff
    source: external
    tool: pip
    version: ">=0.4.0,<1.0"
