        relative: src/modules/free/business/approval_engine/approval_engine_types.py
      - template: templates/base/approval_engine_health.py.j2
        relative: src/health/business/approval_engine.py
      - template: templates/vendor/nestjs/configuration.js.j2
        relative: nestjs/configuration.js
  variants:
    fastapi: &fastapi_variant
      root: .
      context:
        framework: fastapi
        module_class_name: ApprovalEngine
      files:
        - template: templates/variants/fastapi/approval_engine.py.j2
          output: src/modules/free/business/approval_engine/approval_engine.py
        - template: templates/variants/fastapi/approval_engine_routes.py.j2
          output: src/modules/free/business/approval_engine/routers/business/approval_engine.py
        - template: templates/variants/fastapi/approval_engine_health.py.j2
          output: src/health/business/approval_engine.py
        - template: templates/tests/integration/test_approval_engine_integration.j2
          output: tests/modules/free/integration/business/approval_engine/test_approval_engine_integration.py
        - template: templates/variants/fastapi/tests/test_approval_engine_e2e.py
          output: tests/modules/e2e/free/business/approval_engine/test_approval_engine_e2e.py

    # Compatibility aliases: the installer uses kit profile names.
    fastapi.standard: *fastapi_variant
    fastapi.ddd: *fastapi_variant

    nestjs: &nestjs_variant
      root: .
      context:
        framework: nestjs
        vendor_configuration_relative: nestjs/configuration.js
        module_class_name: ApprovalEngine
        module_kebab: approval-engine
      files:
        - template: templates/variants/nestjs/approval_engine.service.ts.j2
          output: src/modules/free/business/approval_engine/approval_engine.service.ts
        - template: templates/variants/nestjs/approval_engine.controller.ts.j2
          output: src/modules/free/business/approval_engine/approval_engine.controller.ts
        - template: templates/variants/nestjs/approval_engine.module.ts.j2
          output: src/modules/free/business/approval_engine/approval_engine.module.ts
        - template: templates/variants/nestjs/approval_engine.health.ts.j2
          output: src/health/approval_engine.health.ts
        - template: templates/variants/nestjs/approval_engine.validation.ts.j2
          output: src/modules/free/business/approval_engine/approval_engine.validation.ts
        - template: templates/variants/nestjs/approval_engine.index.ts.j2
          output: src/modules/free/business/approval_engine/index.ts
        - template: templates/variants/nestjs/approval_engine.configuration.ts.j2
          output: src/modules/free/business/approval_engine/configuration.ts
        - template: templates/variants/nestjs/tests/approval_engine.e2e-spec.ts
          output: tests/modules/e2e/business/approval_engine/approval_engine.e2e-spec.ts

    nestjs.standard: *nestjs_variant
  snippets:
    enabled: true
    config: config/snippets.yaml
    default: []
compatibility:
  python: ">=3.9,<4.0"
  frameworks:
    - fastapi
    - nestjs
  os:
    - linux
    - darwin
    - windows
testing:
  coverage_min: 85
  integration_tests: true
  e2e_tests: false
  unit_tests:
    - tests/modules/free/business/approval_engine/test_approval_engine_generator.py
    - tests/modules/free/business/approval_engine/test_approval_engine_overrides.py
    - tests/modules/free/business/approval_engine/test_approval_engine_runtime.py
    - tests/modules/free/business/approval_engine/test_approval_engine_adapters.py
    - tests/modules/free/business/approval_engine/test_approval_engine_validation.py
    - tests/modules/free/business/approval_engine/test_approval_engine_error_handling.py
    - tests/modules/free/business/approval_engine/test_approval_engine_health_check.py
    - tests/modules/free/business/approval_engine/test_approval_engine_framework_variants.py
    - tests/modules/free/business/approval_engine/test_approval_engine_vendor_layer.py
    - tests/modules/free/business/approval_engine/test_approval_engine_configuration.py
    - tests/modules/free/business/approval_engine/test_approval_engine_versioning.py
    - tests/modules/free/business/approval_engine/test_approval_engine_standard_module.py
  integration_test_files:
