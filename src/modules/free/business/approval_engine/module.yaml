name: approval_engine
display_name: "Approval Engine"
description: "Approval workflow engine with policies, required reasons, reviewer decisions, escalation, and immutable audit trails"
version: 0.1.5
access: free
status: stable
tier: free
category: business
tags:
  - business
  - approvals
  - audit
  - workflow
  - admin
depends_on:
  - free/security/audit_policy
  - free/observability/core
  - free/tasks/workflow_engine
generated_from_config: true
profile_inherits:
  fastapi.standard: fastapi
  fastapi.ddd: fastapi
  nestjs.standard: nestjs
config_sources:
  - config/base.yaml
  - config/snippets.yaml
