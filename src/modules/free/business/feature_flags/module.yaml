  - tests/modules/free/business/feature_flags/test_feature_flags_health_check.py
  - tests/modules/free/business/feature_flags/test_feature_flags_framework_variants.py
  - tests/modules/free/business/feature_flags/test_feature_flags_vendor_layer.py
  - tests/modules/free/business/feature_flags/test_feature_flags_configuration.py
  - tests/modules/free/business/feature_flags/test_feature_flags_versioning.py
  - tests/modules/free/business/feature_flags/test_feature_flags_standard_module.py
  integration_test_files:
