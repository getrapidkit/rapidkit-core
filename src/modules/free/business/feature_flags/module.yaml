name: feature_flags
display_name: Feature Flags
description: Feature flag scaffolding for staged rollout, entitlement-aware gates, experiments, and kill
  switches
version: 0.1.9
access: free
status: stable
tier: free
category: business
tags:
- feature-flags
- rollout
- experiments
- kill-switches
generated_from_config: true
profile_inherits:
  fastapi.standard: fastapi
  fastapi.ddd: fastapi
  nestjs.standard: nestjs
config_sources:
- config/base.yaml
- config/snippets.yaml
generation:
  vendor:
    root: .rapidkit/vendor
    files:
    - template: templates/base/feature_flags.py.j2
      relative: src/modules/free/business/feature_flags/feature_flags.py
    - template: templates/base/feature_flags_types.py.j2
      relative: src/modules/free/business/feature_flags/feature_flags_types.py
    - template: templates/base/feature_flags_health.py.j2
      relative: src/health/business/feature_flags.py
    - template: templates/vendor/nestjs/configuration.js.j2
      relative: nestjs/configuration.js
  variants:
    fastapi: &fastapi_variant
      root: .
      context:
        framework: fastapi
        module_class_name: FeatureFlags
      files:
      - template: templates/variants/fastapi/feature_flags.py.j2
        output: src/modules/free/business/feature_flags/feature_flags.py
      - template: templates/variants/fastapi/feature_flags_routes.py.j2
        output: src/modules/free/business/feature_flags/routers/business/feature_flags.py
      - template: templates/variants/fastapi/feature_flags_health.py.j2
        output: src/health/business/feature_flags.py
      - template: templates/tests/integration/test_feature_flags_integration.j2
        output: tests/modules/free/integration/business/feature_flags/test_feature_flags_integration.py
      - template: templates/variants/fastapi/tests/test_feature_flags_e2e.py
        output: tests/modules/e2e/free/business/feature_flags/test_feature_flags_e2e.py
    fastapi.standard: *fastapi_variant
    fastapi.ddd: *fastapi_variant
    nestjs: &nestjs_variant
      root: .
      context:
        framework: nestjs
        vendor_configuration_relative: nestjs/configuration.js
        module_class_name: FeatureFlags
        module_kebab: feature-flags
      files:
      - template: templates/variants/nestjs/feature_flags.service.ts.j2
        output: src/modules/free/business/feature_flags/feature_flags.service.ts
      - template: templates/variants/nestjs/feature_flags.controller.ts.j2
        output: src/modules/free/business/feature_flags/feature_flags.controller.ts
      - template: templates/variants/nestjs/feature_flags.module.ts.j2
        output: src/modules/free/business/feature_flags/feature_flags.module.ts
      - template: templates/variants/nestjs/feature_flags.health.ts.j2
        output: src/health/feature_flags.health.ts
      - template: templates/variants/nestjs/feature_flags.validation.ts.j2
        output: src/modules/free/business/feature_flags/feature_flags.validation.ts
      - template: templates/variants/nestjs/feature_flags.index.ts.j2
        output: src/modules/free/business/feature_flags/index.ts
      - template: templates/variants/nestjs/feature_flags.configuration.ts.j2
        output: src/modules/free/business/feature_flags/configuration.ts
      - template: templates/variants/nestjs/tests/feature_flags.e2e-spec.ts
        output: tests/modules/e2e/business/feature_flags/feature_flags.e2e-spec.ts
    nestjs.standard: *nestjs_variant
  snippets:
    enabled: true
    config: config/snippets.yaml
    default: []
compatibility:
  python: '>=3.9,<4.0'
  frameworks:
  - fastapi
  - nestjs
  os:
  - linux
  - darwin
  - windows
