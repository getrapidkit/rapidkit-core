name: forms_engine
display_name: "Forms Engine"
description: "Schema-driven forms engine with validation, submissions, workflow hooks, and audit-ready exports"
version: 0.1.8
access: free
status: stable
tier: free
category: business
tags:
  - business
  - forms
  - validation
  - submissions
  - workflow
depends_on:
  - free/security/audit_policy
  - free/observability/core
  - free/tasks/workflow_engine
generated_from_config: true
profile_inherits:
