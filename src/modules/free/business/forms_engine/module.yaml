  fastapi.ddd: fastapi
  nestjs.standard: nestjs
config_sources:
  - config/base.yaml
  - config/snippets.yaml
generation:
  vendor:
    root: .rapidkit/vendor
    files:
      - template: templates/base/forms_engine.py.j2
        relative: src/modules/free/business/forms_engine/forms_engine.py
      - template: templates/base/forms_engine_types.py.j2
        relative: src/modules/free/business/forms_engine/forms_engine_types.py
      - template: templates/base/forms_engine_health.py.j2
        relative: src/health/business/forms_engine.py
      - template: templates/vendor/nestjs/configuration.js.j2
        relative: nestjs/configuration.js
  variants:
    fastapi: &fastapi_variant
      root: .
      context:
        framework: fastapi
        module_class_name: FormsEngine
      files:
        - template: templates/variants/fastapi/forms_engine.py.j2
          output: src/modules/free/business/forms_engine/forms_engine.py
        - template: templates/variants/fastapi/forms_engine_routes.py.j2
          output: src/modules/free/business/forms_engine/routers/business/forms_engine.py
        - template: templates/variants/fastapi/forms_engine_health.py.j2
          output: src/health/business/forms_engine.py
        - template: templates/tests/integration/test_forms_engine_integration.j2
          output: tests/modules/free/integration/business/forms_engine/test_forms_engine_integration.py
        - template: templates/variants/fastapi/tests/test_forms_engine_e2e.py
          output: tests/modules/e2e/free/business/forms_engine/test_forms_engine_e2e.py

    # Compatibility aliases: the installer uses kit profile names.
    fastapi.standard: *fastapi_variant
    fastapi.ddd: *fastapi_variant

    nestjs: &nestjs_variant
      root: .
      context:
        framework: nestjs
        vendor_configuration_relative: nestjs/configuration.js
        module_class_name: FormsEngine
        module_kebab: forms-engine
      files:
        - template: templates/variants/nestjs/forms_engine.service.ts.j2
          output: src/modules/free/business/forms_engine/forms_engine.service.ts
        - template: templates/variants/nestjs/forms_engine.controller.ts.j2
          output: src/modules/free/business/forms_engine/forms_engine.controller.ts
        - template: templates/variants/nestjs/forms_engine.module.ts.j2
          output: src/modules/free/business/forms_engine/forms_engine.module.ts
        - template: templates/variants/nestjs/forms_engine.health.ts.j2
          output: src/health/forms_engine.health.ts
        - template: templates/variants/nestjs/forms_engine.validation.ts.j2
          output: src/modules/free/business/forms_engine/forms_engine.validation.ts
        - template: templates/variants/nestjs/forms_engine.index.ts.j2
          output: src/modules/free/business/forms_engine/index.ts
        - template: templates/variants/nestjs/forms_engine.configuration.ts.j2
          output: src/modules/free/business/forms_engine/configuration.ts
        - template: templates/variants/nestjs/tests/forms_engine.e2e-spec.ts
          output: tests/modules/e2e/business/forms_engine/forms_engine.e2e-spec.ts

    nestjs.standard: *nestjs_variant
  snippets:
    enabled: true
    config: config/snippets.yaml
    default: []
compatibility:
  python: ">=3.9,<4.0"
  frameworks:
    - fastapi
    - nestjs
  os:
    - linux
    - darwin
    - windows
testing:
  coverage_min: 85
  integration_tests: true
  e2e_tests: false
  unit_tests:
    - tests/modules/free/business/forms_engine/test_forms_engine_generator.py
    - tests/modules/free/business/forms_engine/test_forms_engine_overrides.py
    - tests/modules/free/business/forms_engine/test_forms_engine_runtime.py
    - tests/modules/free/business/forms_engine/test_forms_engine_adapters.py
    - tests/modules/free/business/forms_engine/test_forms_engine_validation.py
    - tests/modules/free/business/forms_engine/test_forms_engine_error_handling.py
    - tests/modules/free/business/forms_engine/test_forms_engine_health_check.py
    - tests/modules/free/business/forms_engine/test_forms_engine_framework_variants.py
    - tests/modules/free/business/forms_engine/test_forms_engine_vendor_layer.py
    - tests/modules/free/business/forms_engine/test_forms_engine_configuration.py
    - tests/modules/free/business/forms_engine/test_forms_engine_versioning.py
    - tests/modules/free/business/forms_engine/test_forms_engine_standard_module.py
  integration_test_files:
    - tests/modules/free/integration/business/forms_engine/test_forms_engine_integration.py
