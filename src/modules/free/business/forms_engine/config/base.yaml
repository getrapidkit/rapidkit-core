# Module configuration baseline for Forms Engine
name: forms_engine
display_name: "Forms Engine"
description: "Schema-driven forms engine with validation, submissions, workflow hooks, and audit-ready exports"
root_path: src/

profiles:
  fastapi/standard:
    description: "FastAPI runtime profile for Forms Engine REST, health, and overrides integration."
  nestjs/standard:
    description: "NestJS module wiring providers and controllers for Forms Engine."
  vendor/baseline:
    description: "Vendor layer templates emitted for Forms Engine runtime contracts."
variables:
  log_level:
    type: string
    default: INFO
    description: "Logging threshold used by Forms Engine components."
    validation: "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)$"
  request_timeout_seconds:
    type: integer
    default: 30
    description: "Default timeout (seconds) for outbound calls initiated by Forms Engine."
    validation: "^[0-9]+$"
  feature_flag_enabled:
    type: boolean
    default: false
    description: "Toggle demonstrating feature gating inside Forms Engine workflows."
depends_on:
  fastapi/standard: []
  nestjs/standard: []
dev_dependencies:
  -
    name: pytest
    source: external
    tool: pip
    version: ">=8.0.0,<9.0"
  -
    name: pytest-asyncio
    source: external
    tool: pip
    version: ">=0.23.0,<1.0"
  -
    name: ruff
    source: external
    tool: pip
    version: ">=0.4.0,<1.0"
