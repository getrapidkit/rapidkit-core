name: admin_console
display_name: "Admin Console"
description: "Reusable admin console foundation with action registry, permission checks, audit context, and operational summaries"
version: 0.1.5
access: free
status: stable
tier: free
category: business
tags:
  - business
  - admin
  - operations
  - audit
depends_on:
  - free/business/approval_engine
  - free/security/audit_policy
  - free/observability/core
generated_from_config: true
profile_inherits:
  fastapi.standard: fastapi
  fastapi.ddd: fastapi
  nestjs.standard: nestjs
config_sources:
  - config/base.yaml
  - config/snippets.yaml
generation:
  vendor:
    root: .rapidkit/vendor
    files:
      - template: templates/base/admin_console.py.j2
        relative: src/modules/free/business/admin_console/admin_console.py
      - template: templates/base/admin_console_types.py.j2
        relative: src/modules/free/business/admin_console/admin_console_types.py
      - template: templates/base/admin_console_health.py.j2
        relative: src/health/business/admin_console.py
      - template: templates/vendor/nestjs/configuration.js.j2
        relative: nestjs/configuration.js
  variants:
    fastapi: &fastapi_variant
      root: .
      context:
        framework: fastapi
        module_class_name: AdminConsole
      files:
        - template: templates/variants/fastapi/admin_console.py.j2
          output: src/modules/free/business/admin_console/admin_console.py
        - template: templates/variants/fastapi/admin_console_routes.py.j2
          output: src/modules/free/business/admin_console/routers/business/admin_console.py
        - template: templates/variants/fastapi/admin_console_health.py.j2
          output: src/health/business/admin_console.py
        - template: templates/tests/integration/test_admin_console_integration.j2
          output: tests/modules/free/integration/business/admin_console/test_admin_console_integration.py
        - template: templates/variants/fastapi/tests/test_admin_console_e2e.py
          output: tests/modules/e2e/free/business/admin_console/test_admin_console_e2e.py

    # Compatibility aliases: the installer uses kit profile names.
    fastapi.standard: *fastapi_variant
    fastapi.ddd: *fastapi_variant

    nestjs: &nestjs_variant
      root: .
      context:
        framework: nestjs
        vendor_configuration_relative: nestjs/configuration.js
        module_class_name: AdminConsole
        module_kebab: admin-console
      files:
        - template: templates/variants/nestjs/admin_console.service.ts.j2
          output: src/modules/free/business/admin_console/admin_console.service.ts
        - template: templates/variants/nestjs/admin_console.controller.ts.j2
          output: src/modules/free/business/admin_console/admin_console.controller.ts
        - template: templates/variants/nestjs/admin_console.module.ts.j2
          output: src/modules/free/business/admin_console/admin_console.module.ts
        - template: templates/variants/nestjs/admin_console.health.ts.j2
          output: src/health/admin_console.health.ts
        - template: templates/variants/nestjs/admin_console.validation.ts.j2
          output: src/modules/free/business/admin_console/admin_console.validation.ts
        - template: templates/variants/nestjs/admin_console.index.ts.j2
          output: src/modules/free/business/admin_console/index.ts
        - template: templates/variants/nestjs/admin_console.configuration.ts.j2
          output: src/modules/free/business/admin_console/configuration.ts
        - template: templates/variants/nestjs/tests/admin_console.e2e-spec.ts
          output: tests/modules/e2e/business/admin_console/admin_console.e2e-spec.ts

    nestjs.standard: *nestjs_variant
  snippets:
    enabled: true
    config: config/snippets.yaml
    default: []
compatibility:
  python: ">=3.9,<4.0"
  frameworks:
    - fastapi
    - nestjs
  os:
    - linux
    - darwin
    - windows
testing:
  coverage_min: 70
  integration_tests: true
  e2e_tests: false
  unit_tests:
    - tests/modules/free/business/admin_console/test_admin_console_generator.py
    - tests/modules/free/business/admin_console/test_admin_console_overrides.py
    - tests/modules/free/business/admin_console/test_admin_console_runtime.py
    - tests/modules/free/business/admin_console/test_admin_console_adapters.py
    - tests/modules/free/business/admin_console/test_admin_console_validation.py
    - tests/modules/free/business/admin_console/test_admin_console_error_handling.py
    - tests/modules/free/business/admin_console/test_admin_console_health_check.py
    - tests/modules/free/business/admin_console/test_admin_console_framework_variants.py
    - tests/modules/free/business/admin_console/test_admin_console_vendor_layer.py
    - tests/modules/free/business/admin_console/test_admin_console_configuration.py
    - tests/modules/free/business/admin_console/test_admin_console_versioning.py
    - tests/modules/free/business/admin_console/test_admin_console_standard_module.py
  integration_test_files:
    - tests/modules/free/integration/business/admin_console/test_admin_console_integration.py
  fixtures: []
