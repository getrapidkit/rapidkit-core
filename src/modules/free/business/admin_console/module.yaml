  issues: https://github.com/rapidkitlabs/rapidkit-core/issues
  discussions: https://github.com/rapidkitlabs/rapidkit-core/discussions
  documentation: https://docs.rapidkit.top/modules/admin_console
changelog:
  - version: "0.1.5"
    date: "2026-06-08"
    notes: "See docs/changelog.md"
validation:
  pre_install:
    - check_python_version
  post_install:
    - validate_generated_code
rollback:
  strategy: uninstall
  backup_path: .rapidkit/backups/
  max_backups: 3
performance:
  lazy_loading: true
  caching:
    templates: true
    ttl: 300
capabilities:
  - admin_action_registry
  - permission_checks
  - required_reasons
  - run_history
  - operational_summary
  - health_checks
metadata:
  enterprise_ready: true
  free_marketplace_module: true
  product_factory_priority: high
