# Module configuration baseline for Org Admin Console
name: org_admin_console
display_name: "Org Admin Console"
description: "Organization admin console for tenant settings, memberships, invitations, roles, and governance workflows"
root_path: src/

profiles:
  fastapi/standard:
    description: "FastAPI runtime profile for Org Admin Console REST, health, and overrides integration."
  nestjs/standard:
    description: "NestJS module wiring providers and controllers for Org Admin Console."
  vendor/baseline:
    description: "Vendor layer templates emitted for Org Admin Console runtime contracts."
variables:
  log_level:
    type: string
    default: INFO
    description: "Logging threshold used by Org Admin Console components."
    validation: "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)$"
  request_timeout_seconds:
    type: integer
    default: 30
    description: "Default timeout (seconds) for outbound calls initiated by Org Admin Console."
    validation: "^[0-9]+$"
  feature_flag_enabled:
    type: boolean
    default: false
    description: "Toggle demonstrating feature gating inside Org Admin Console workflows."
depends_on:
  fastapi/standard: []
  nestjs/standard: []
dev_dependencies:
  -
    name: pytest
    source: external
    tool: pip
    version: ">=8.0.0,<9.0"
  -
    name: pytest-asyncio
    source: external
    tool: pip
    version: ">=0.23.0,<1.0"
  -
    name: ruff
    source: external
    tool: pip
    version: ">=0.4.0,<1.0"
