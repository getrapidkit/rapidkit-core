# Module configuration baseline for Connector Pack Library
name: connector_pack_library
display_name: "Connector Pack Library"
description: "Connector pack registry for provider catalogs, scopes, install state, health, and credential rotation workflows"
root_path: src/

profiles:
  fastapi/standard:
    description: "FastAPI runtime profile for Connector Pack Library REST, health, and overrides integration."
  nestjs/standard:
    description: "NestJS module wiring providers and controllers for Connector Pack Library."
  vendor/baseline:
    description: "Vendor layer templates emitted for Connector Pack Library runtime contracts."
variables:
  log_level:
    type: string
    default: INFO
    description: "Logging threshold used by Connector Pack Library components."
    validation: "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)$"
  request_timeout_seconds:
    type: integer
    default: 30
    description: "Default timeout (seconds) for outbound calls initiated by Connector Pack Library."
    validation: "^[0-9]+$"
  feature_flag_enabled:
    type: boolean
    default: false
    description: "Toggle demonstrating feature gating inside Connector Pack Library workflows."
depends_on:
  fastapi/standard: []
  nestjs/standard: []
dev_dependencies:
  -
    name: pytest
    source: external
    tool: pip
    version: ">=8.0.0,<9.0"
  -
    name: pytest-asyncio
    source: external
    tool: pip
    version: ">=0.23.0,<1.0"
  -
    name: ruff
    source: external
    tool: pip
    version: ">=0.4.0,<1.0"
