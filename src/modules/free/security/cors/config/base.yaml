# Default configuration scaffold for Cors
profiles:
  fastapi/standard:
    description: Standard FastAPI project support for this module.
  fastapi/ddd:
    inherits: fastapi/standard
    description: FastAPI DDD project support with the same runtime contract.
  nestjs/standard:
    description: NestJS project support for this module.

defaults:
  enabled: true
  allow_origins:
    - "*"
  allow_credentials: true
  allow_methods:
    - "*"
  allow_headers:
    - "*"
  max_age: 600
  log_level: INFO
  metadata: {}
