# Module configuration baseline for Audit Policy
name: audit_policy
display_name: "Audit Policy"
description: "Immutable audit event, admin policy, reason capture, and compliance export scaffolding"
root_path: src/

profiles:
  fastapi/standard:
    description: "FastAPI runtime profile for Audit Policy REST, health, and overrides integration."
  nestjs/standard:
    description: "NestJS module wiring providers and controllers for Audit Policy."
  vendor/baseline:
    description: "Vendor layer templates emitted for Audit Policy runtime contracts."
variables:
  log_level:
    type: string
    default: INFO
    description: "Logging threshold used by Audit Policy components."
    validation: "^(CRITICAL|ERROR|WARNING|INFO|DEBUG|TRACE)$"
  request_timeout_seconds:
    type: integer
    default: 30
    description: "Default timeout (seconds) for outbound calls initiated by Audit Policy."
    validation: "^[0-9]+$"
  feature_flag_enabled:
    type: boolean
    default: false
    description: "Toggle demonstrating feature gating inside Audit Policy workflows."
depends_on:
  fastapi/standard: []
  nestjs/standard: []
dev_dependencies:
  -
    name: pytest
    source: external
    tool: pip
    version: ">=8.0.0,<9.0"
  -
    name: pytest-asyncio
    source: external
    tool: pip
    version: ">=0.23.0,<1.0"
  -
    name: ruff
    source: external
    tool: pip
    version: ">=0.4.0,<1.0"
