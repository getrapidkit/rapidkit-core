          output: tests/modules/e2e/free/observability/analytics_dashboard/test_analytics_dashboard_e2e.py

    # Compatibility aliases: the installer uses kit profile names.
    fastapi.standard: *fastapi_variant
    fastapi.ddd: *fastapi_variant

    nestjs: &nestjs_variant
      root: .
      context:
        framework: nestjs
        vendor_configuration_relative: nestjs/configuration.js
        module_class_name: AnalyticsDashboard
        module_kebab: analytics-dashboard
      files:
        - template: templates/variants/nestjs/analytics_dashboard.service.ts.j2
          output: src/modules/free/observability/analytics_dashboard/analytics_dashboard.service.ts
