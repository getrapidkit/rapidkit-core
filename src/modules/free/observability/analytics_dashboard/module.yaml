        - template: templates/variants/nestjs/analytics_dashboard.health.ts.j2
          output: src/health/analytics_dashboard.health.ts
        - template: templates/variants/nestjs/analytics_dashboard.validation.ts.j2
          output: src/modules/free/observability/analytics_dashboard/analytics_dashboard.validation.ts
        - template: templates/variants/nestjs/analytics_dashboard.index.ts.j2
          output: src/modules/free/observability/analytics_dashboard/index.ts
        - template: templates/variants/nestjs/analytics_dashboard.configuration.ts.j2
          output: src/modules/free/observability/analytics_dashboard/configuration.ts
        - template: templates/variants/nestjs/tests/analytics_dashboard.e2e-spec.ts
          output: tests/modules/e2e/observability/analytics_dashboard/analytics_dashboard.e2e-spec.ts

    nestjs.standard: *nestjs_variant
  snippets:
    enabled: true
    config: config/snippets.yaml
    default: []
