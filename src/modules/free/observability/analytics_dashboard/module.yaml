name: analytics_dashboard
display_name: "Analytics Dashboard"
description: "Analytics dashboard foundation with metrics, widgets, dashboard snapshots, drilldowns, and audit-ready reporting"
version: 0.1.5
access: free
status: stable
tier: free
category: observability
tags:
